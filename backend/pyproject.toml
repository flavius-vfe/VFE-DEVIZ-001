[project]
name = "vfe-deviz-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn[standard]>=0.35,<1",
  "SQLAlchemy==2.0.51",
  "alembic==1.19.2",
  "psycopg[binary]>=3.2,<4",
  "argon2-cffi>=23.1,<26",
  "pydantic>=2.10,<3",
  "python-multipart>=0.0.20,<1"
]

[project.optional-dependencies]
test = [
  "pytest>=8,<9",
  "httpx>=0.28,<1"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
