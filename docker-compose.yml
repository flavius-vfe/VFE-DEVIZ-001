services:
  postgres:
    image: postgres:18.6
    container_name: vfe-deviz-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-deviz}
      POSTGRES_USER: ${POSTGRES_USER:-deviz}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - ${POSTGRES_DATA:-./.data/postgres}:/var/lib/postgresql
    networks: [deviz]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-deviz} -d ${POSTGRES_DB:-deviz}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    image: ghcr.io/flavius-vfe/vfe-deviz-backend:${DEVIZ_VERSION:-latest}
    container_name: vfe-deviz-backend
    build: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      SERVER_IP: ${SERVER_IP:-192.168.0.50}
      FRONTEND_PORT: ${FRONTEND_PORT:-3080}
      BACKEND_PORT: ${BACKEND_PORT:-8030}
      SESSION_DAYS: ${SESSION_DAYS:-7}
      DATA_ROOT: /data
      MIGRATION_MAX_ATTEMPTS: ${MIGRATION_MAX_ATTEMPTS:-30}
      MIGRATION_RETRY_SECONDS: ${MIGRATION_RETRY_SECONDS:-5}
    volumes:
      - ${BACKEND_DATA:-./.data/backend}:/appdata
      - ${DEVIZ_DATA:-./.data/deviz-data}:/data
    ports:
      - "${BACKEND_PORT:-8030}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [deviz]
    restart: unless-stopped

  worker:
    image: ghcr.io/flavius-vfe/vfe-deviz-worker:${DEVIZ_VERSION:-latest}
    container_name: vfe-deviz-worker
    build:
      context: ./worker
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      REFRESH_INTERVAL_SECONDS: ${REFRESH_INTERVAL_SECONDS:-86400}
      DATABASE_RETRY_SECONDS: ${DATABASE_RETRY_SECONDS:-5}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [deviz]
    restart: unless-stopped

  frontend:
    image: ghcr.io/flavius-vfe/vfe-deviz-frontend:${DEVIZ_VERSION:-latest}
    container_name: vfe-deviz-frontend
    build: ./frontend
    environment:
      API_BASE_URL: ${API_BASE_URL:-}
    ports:
      - "${FRONTEND_PORT:-3080}:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks: [deviz]
    restart: unless-stopped

networks:
  deviz:
    name: vfe-deviz
    driver: bridge
