services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-deviz}
      POSTGRES_USER: ${POSTGRES_USER:-deviz}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - ${POSTGRES_DATA:-./.data/postgres}:/var/lib/postgresql/data
    networks: [deviz]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-deviz} -d ${POSTGRES_DB:-deviz}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://deviz:deviz@postgres:5432/deviz}
      SERVER_IP: ${SERVER_IP:-192.168.0.50}
      FRONTEND_PORT: ${FRONTEND_PORT:-3080}
      BACKEND_PORT: ${BACKEND_PORT:-8030}
      SESSION_DAYS: ${SESSION_DAYS:-7}
      DATA_ROOT: /data
    volumes:
      - ${DEVIZ_DATA:-./.data/deviz-data}:/data
    ports:
      - "${BACKEND_PORT:-8030}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [deviz]
    restart: unless-stopped

  worker:
    build:
      context: ./worker
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://deviz:deviz@postgres:5432/deviz}
      REFRESH_INTERVAL_SECONDS: ${REFRESH_INTERVAL_SECONDS:-86400}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [deviz]
    restart: unless-stopped

  frontend:
    build: ./frontend
    environment:
      BACKEND_PORT: ${BACKEND_PORT:-8030}
    ports:
      - "${FRONTEND_PORT:-3080}:3000"
    depends_on:
      - backend
    networks: [deviz]
    restart: unless-stopped

networks:
  deviz:
    driver: bridge
